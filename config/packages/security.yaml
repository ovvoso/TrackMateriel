security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: login_success
                always_use_default_target_path: false
                target_path_parameter: _target_path
                use_referer: true
            logout:
                path: app_logout
                target: app_login

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        # Routes publiques
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/access-denied, roles: PUBLIC_ACCESS }
        - { path: ^/login-success, roles: IS_AUTHENTICATED_FULLY }
        
        # Routes d'administration
        - { path: ^/admin, roles: ROLE_ADMIN }
        
        # Routes utilisateur
        - { path: ^/user, roles: ROLE_USER }
        
        # Routes équipement - Admin seulement pour création/modification
        - { path: ^/equipement/new, roles: ROLE_ADMIN }
        - { path: ^/equipement/.*/edit, roles: ROLE_ADMIN }
        - { path: ^/equipement/.*/delete, roles: ROLE_ADMIN }
        - { path: ^/equipement, roles: ROLE_USER }
        
        # Routes attribution - Admin seulement pour création/modification
        - { path: ^/attribution/new, roles: ROLE_ADMIN }
        - { path: ^/attribution/.*/edit, roles: ROLE_ADMIN }
        - { path: ^/attribution/.*/delete, roles: ROLE_ADMIN }
        - { path: ^/attribution, roles: ROLE_USER }
        
        # Routes maintenance - Utilisateurs connectés
        - { path: ^/maintenance, roles: ROLE_USER }
        
        # Route profil utilisateur
        - { path: ^/profile, roles: ROLE_USER }
        
        # Page d'accueil accessible aux utilisateurs connectés
        - { path: ^/home, roles: ROLE_USER }
        
        # Route racine - nécessite une authentification
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
