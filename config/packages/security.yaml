security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Identity\Entity\User

    # Chaque profil hérite des droits du profil inférieur
    role_hierarchy:
        ROLE_TECHNICIEN: ROLE_USAGER
        ROLE_GESTIONNAIRE: [ROLE_TECHNICIEN, ROLE_USAGER]
        ROLE_ADMIN: ROLE_GESTIONNAIRE

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Identity\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email
                password_parameter: password
                enable_csrf: true
                default_target_path: app_dashboard
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                signature_properties: [password, active]
            logout:
                path: app_logout
                target: app_login
                enable_csrf: true

    # Pas d'inscription publique : tout est réservé aux comptes connectés,
    # les droits fins sont vérifiés dans les contrôleurs (attributs et voters).
    access_control:
        - { path: ^/connexion, roles: PUBLIC_ACCESS }
        - { path: ^/mot-de-passe-oublie, roles: PUBLIC_ACCESS }
        - { path: ^/compte/(activer|reinitialiser)/, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USAGER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
