# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        # Fabriques et jeux de démonstration : Foundry n'existe qu'en dev et en test
        exclude:
            - '../src/Kernel.php'
            - '../src/*/Factory/'
            - '../src/Story/'

when@dev: &demo_data
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        App\Identity\Factory\:
            resource: '../src/Identity/Factory/'

        App\Story\:
            resource: '../src/Story/'

when@test: *demo_data
