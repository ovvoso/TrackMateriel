# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    # Devise des prix d'achat (code ISO 4217)
    app.currency: XOF
    # Instance de démonstration publique (voir .env)
    app.demo: '%env(bool:APP_DEMO)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
