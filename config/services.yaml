# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    # Devise des prix d'achat (code ISO 4217)
    app.currency: XOF

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        # Fabriques et jeux de démonstration : Foundry n'existe qu'en dev et en test
        exclude:
            - '../src/Kernel.php'
            - '../src/*/Factory/'
            - '../src/Story/'

when@dev: &demo_data
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        App\:
            resource: '../src/{*/Factory,Story}/'

when@test: *demo_data
